<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <title>Kongsro store shot 1</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(145deg, #1c1c1c 0%, #2a2a28 45%, #3d3428 100%);
        color: #f4f1ea;
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 48px;
        padding: 64px 72px;
      }
      .left h1 {
        font-size: 72px;
        line-height: 0.95;
        margin: 0 0 20px;
        letter-spacing: -0.03em;
      }
      .left .tag {
        display: inline-block;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.7;
        margin-bottom: 18px;
      }
      .left p {
        font-size: 24px;
        line-height: 1.35;
        max-width: 28ch;
        margin: 0;
        color: #d9d3c7;
      }
      .sites {
        margin-top: 36px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .sites span {
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 13px;
        color: #e8e2d6;
      }
      .popup {
        background: #fff;
        color: #111;
        border-radius: 16px;
        padding: 22px 22px 18px;
        width: 320px;
        justify-self: end;
        align-self: center;
        box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      }
      .popup h2 {
        font-size: 20px;
        margin: 0 0 14px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        margin: 8px 0;
      }
      fieldset {
        border: 1px solid #ddd;
        border-radius: 10px;
        margin: 14px 0 0;
        padding: 10px 12px 12px;
      }
      legend {
        font-size: 12px;
        color: #666;
        padding: 0 4px;
      }
      .check {
        width: 16px;
        height: 16px;
        border-radius: 3px;
        background: #111;
        position: relative;
        flex: 0 0 auto;
      }
      .check::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 1px;
        width: 5px;
        height: 9px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="tag">Chrome-utvidelse</div>
      <h1>Kongsro</h1>
      <p>Skjuler kongelig mediestorm på norske nettaviser — lokalt i nettleseren.</p>
      <div class="sites">
        <span>VG</span><span>Dagbladet</span><span>Aftenposten</span>
        <span>NRK</span><span>TV 2</span><span>Nettavisen</span>
        <span>E24</span><span>ABC</span><span>Dagsavisen</span>
      </div>
    </div>
    <div class="popup">
      <h2>Kongsro</h2>
      <div class="row"><span class="check"></span><span>Filtrering på</span></div>
      <fieldset>
        <legend>Nettsteder</legend>
        <div class="row"><span class="check"></span><span>VG</span></div>
        <div class="row"><span class="check"></span><span>Dagbladet</span></div>
        <div class="row"><span class="check"></span><span>Aftenposten</span></div>
        <div class="row"><span class="check"></span><span>NRK</span></div>
        <div class="row"><span class="check"></span><span>TV 2</span></div>
        <div class="row"><span class="check"></span><span>Nettavisen</span></div>
        <div class="row"><span class="check"></span><span>E24</span></div>
        <div class="row"><span class="check"></span><span>ABC Nyheter</span></div>
        <div class="row"><span class="check"></span><span>Dagsavisen</span></div>
      </fieldset>
    </div>
  </body>
</html>
